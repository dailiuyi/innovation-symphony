name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Codex for offline configuration tests
        run: |
          CODEX_VERSION=$(python3 -c 'import json; print(json.load(open("../scripts/runtime-identity.json"))["codex"]["version"])')
          CODEX_SHA256=$(python3 -c 'import json; print(json.load(open("../scripts/runtime-identity.json"))["codex"]["linux_archive_sha256"])')
          codex_dir="$RUNNER_TEMP/symphony-test-codex"
          mkdir -p "$codex_dir"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 240 \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/codex-x86_64-unknown-linux-musl.tar.gz" \
            --output "$codex_dir/codex.tar.gz"
          echo "$CODEX_SHA256  $codex_dir/codex.tar.gz" | sha256sum --check
          tar -xzf "$codex_dir/codex.tar.gz" -C "$codex_dir"
          codex_bin="$codex_dir/codex-x86_64-unknown-linux-musl"
          test -x "$codex_bin"
          "$codex_bin" --version
          test "$("$codex_bin" --version)" = "codex-cli $CODEX_VERSION"
          echo "SYMPHONY_TEST_CODEX=$codex_bin" >> "$GITHUB_ENV"

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Verify toolchain matches runtime-identity
        run: mise exec -- python3 ../scripts/runtime_identity.py

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-ubuntu-24.04-${{ hashFiles('scripts/runtime-identity.json', 'elixir/mise.toml') }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-${{ hashFiles('scripts/runtime-identity.json', 'elixir/mise.toml') }}-mix-

      - name: Verify check environment isolation
        env:
          RUN_MIX_INTEGRATION: "1"
        run: mise exec -- python3 -m unittest discover -s ../scripts/tests -v

      - name: Record process visibility before make all
        run: python3 ../scripts/proc_visibility.py

      - name: Verify make all in a private PID namespace
        run: |
          # The same isolation as the VM gate, as the runner's own user.
          check_path=$(mise exec -- printenv PATH)
          sudo --preserve-env=SYMPHONY_TEST_CODEX,MIX_HOME,MIX_ARCHIVES,MIX_REBAR3,HEX_HOME bash ../scripts/vm/isolated-check.sh "$(id -un)" "$check_path" "$GITHUB_WORKSPACE"

      - name: Record process visibility after a failed make all
        if: failure()
        run: python3 ../scripts/proc_visibility.py

  view:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install View dependencies
        run: |
          python -m pip install -r view/requirements.txt
          npm install --prefix view/build/browser --no-audit --no-fund playwright@1.62.1
          view/build/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Python, JS, self_check, entrypoints and synthetic browser acceptance
        env:
          NODE_PATH: ${{ github.workspace }}/view/build/browser/node_modules
        run: python -B scripts/run_view_checks.py --output view/build/checks
