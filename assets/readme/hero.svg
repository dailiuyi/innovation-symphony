<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto" role="img" aria-label="Innovation Symphony Header Banner">
  <title>Innovation Symphony Hero</title>
  <style><![CDATA[
    .bg { fill: #0b0f19; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    .panel { fill: #111827; stroke: #1e293b; stroke-width: 1.5; }
    .badge { fill: #1e293b; stroke: #334155; stroke-width: 1; }
    .txt-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.12em; text-transform: uppercase; }
    .txt-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 38px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.02em; }
    .txt-desc { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.6; fill: #94a3b8; }
    .txt-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .telemetry-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .telemetry-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #34d399; }
    .code-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }

    /* Flow & Gates */
    .flow-edge { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .node-pill { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.2; rx: 6; }
    .gate-pill { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.2; rx: 6; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .grid { stroke: #e2e8f0; }
      .panel { fill: #ffffff; stroke: #e2e8f0; }
      .badge { fill: #f1f5f9; stroke: #cbd5e1; }
      .txt-tag { fill: #0284c7; }
      .txt-title { fill: #0f172a; }
      .txt-desc { fill: #475569; }
      .txt-sub { fill: #334155; }
      .telemetry-txt { fill: #64748b; }
      .telemetry-val { fill: #059669; }
      .code-txt { fill: #334155; }
      .flow-edge { stroke: #0284c7; }
      .node-pill { fill: #f1f5f9; stroke: #0284c7; }
      .gate-pill { fill: #e0e7ff; stroke: #6366f1; }
    }
  ]]></style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" class="bg" />

  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="0" x2="60" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="880" y1="0" x2="880" y2="380" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="310" x2="1200" y2="310" />
  </g>

  <!-- Left: Content -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="280" height="26" rx="13" class="badge" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" />
    <text x="24" y="17" class="txt-tag">AGENT ORCHESTRATION // ELIXIR OTP</text>

    <text x="0" y="70" class="txt-title">innovation-symphony</text>
    <text x="0" y="106" class="txt-desc">面向多代码仓库的 AI 自主研发任务编排与治理框架。</text>
    <text x="0" y="132" class="txt-desc">自动发现 `ready` Issue · 沙箱执行自检 · 独立 Review 评审门禁 · 交付 Draft PR。</text>

    <!-- Pillars -->
    <g transform="translate(0, 168)">
      <g transform="translate(0, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#38bdf8" />
        <text x="32" y="25" class="txt-sub">Elixir / OTP 监督树与状态机</text>
      </g>
      <g transform="translate(247, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#34d399" />
        <text x="32" y="25" class="txt-sub">Linux 任务隔离与同会话自检</text>
      </g>
      <g transform="translate(0, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#fb7185" />
        <text x="32" y="25" class="txt-sub">0~5 次有限返工预算与失败自愈</text>
      </g>
      <g transform="translate(247, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#a78bfa" />
        <text x="32" y="25" class="txt-sub">结构化断言门禁与独立看门狗</text>
      </g>
    </g>

    <g transform="translate(0, 286)">
      <text x="0" y="0" class="telemetry-txt">OFFICIAL SYMPHONY BASELINE · 51 EXUNIT TEST SUITES · ZERO HUMAN CODE RUN</text>
    </g>
  </g>

  <!-- Right: Pipeline HUD Diagram -->
  <g transform="translate(680, 40)">
    <rect width="460" height="300" rx="14" class="panel" />

    <!-- Window Header -->
    <line x1="0" y1="36" x2="460" y2="36" stroke="#1e293b" class="grid" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" class="telemetry-txt">ORCHESTRATOR_LIFECYCLE // AGENT_GATES</text>
    <rect x="375" y="10" width="65" height="18" rx="4" class="badge" />
    <text x="388" y="22" class="telemetry-val">ACTIVE</text>

    <!-- Pipeline Stages -->
    <g transform="translate(24, 56)">
      <!-- Stage 1: Issue Listener -->
      <rect width="180" height="44" class="node-pill" />
      <text x="14" y="26" class="code-txt">1. Issue [ready] 识别</text>

      <path d="M 180,22 L 230,22" class="flow-edge" />

      <!-- Stage 2: Coder Sandbox -->
      <g transform="translate(230, 0)">
        <rect width="180" height="44" class="node-pill" />
        <text x="14" y="26" class="code-txt">2. Coder 沙箱实现</text>
      </g>

      <!-- Stage 3: Test Gate -->
      <g transform="translate(0, 68)">
        <rect width="180" height="44" class="gate-pill" />
        <text x="14" y="26" class="code-txt">3. 结构化测试门禁</text>
      </g>

      <path d="M 320,44 L 320,68" class="flow-edge" />
      <path d="M 180,90 L 230,90" class="flow-edge" />

      <!-- Stage 4: Independent Reviewer -->
      <g transform="translate(230, 68)">
        <rect width="180" height="44" class="gate-pill" />
        <text x="14" y="26" class="code-txt">4. 独立 Review 评审</text>
      </g>

      <!-- Stage 5: Draft PR Delivery -->
      <g transform="translate(100, 136)">
        <rect width="210" height="42" rx="21" class="panel" stroke="#34d399" />
        <circle cx="20" cy="21" r="5" fill="#34d399" />
        <text x="34" y="26" class="code-txt" fill="#34d399" font-weight="700">5. 交付 Draft PR</text>
      </g>
    </g>

    <!-- Bottom Telemetry -->
    <g transform="translate(24, 246)">
      <rect width="412" height="38" rx="6" class="badge" />
      <text x="14" y="23" class="telemetry-txt">WATCHDOG &amp; REWORK:</text>
      <text x="160" y="23" class="telemetry-val">0..5 Budget · Auto Self-Healing</text>
    </g>
  </g>
</svg>
